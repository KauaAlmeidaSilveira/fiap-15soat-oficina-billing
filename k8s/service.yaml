apiVersion: v1
kind: Service
metadata:
  name: oficina-billing
  namespace: oficina
  annotations:
    # NLB interno: a entrada publica e o API Gateway, que chega aqui por VPC Link. O lambda-auth
    # encontra este NLB pela tag kubernetes.io/service-name = oficina/oficina-billing.
    # Apagar este Service antes do destroy do infra-k8s, senao o NLB fica orfao e trava a VPC.
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  type: LoadBalancer
  selector:
    app: oficina-billing
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
