spring.application.name=oficina-billing

# Server
server.port=8080

# Actuator / metricas
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}

# Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# JWT
jwt.public.key=${JWT_PUBLIC_KEY:classpath:jwt.public.key}
jwt.issuer=${JWT_ISSUER:http://localhost:8080}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.aprovacao-email.token-validade-dias=${APROVACAO_EMAIL_TOKEN_VALIDADE_DIAS:7}

# SMTP (Gmail) 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_SMTP_USERNAME:}
spring.mail.password=${GMAIL_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Par de chaves exclusivo do link de aprovacao
aprovacao.jwt.public.key=${APROVACAO_JWT_PUBLIC_KEY:classpath:aprovacao.public.key}
aprovacao.jwt.private.key=${APROVACAO_JWT_PRIVATE_KEY:classpath:aprovacao.private.key}

# Validades
app.cobranca.validade-qr=${COBRANCA_VALIDADE_QR:PT24H}

# Mercado Pago
app.mercadopago.base-url=${MERCADOPAGO_BASE_URL:https://api.mercadopago.com}
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
app.mercadopago.external-pos-id=${MERCADOPAGO_EXTERNAL_POS_ID:}
app.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}

# DynamoDB
app.dynamodb.tabela=${DYNAMODB_TABELA:oficina-billing}
app.dynamodb.endpoint=${DYNAMODB_ENDPOINT:}

# Mensageria
app.mensageria.habilitada=${APP_MENSAGERIA_HABILITADA:true}
app.mensageria.fila-comandos=${FILA_BILLING_COMANDOS:oficina-billing-comandos}
app.mensageria.fila-eventos=${FILA_SAGA_EVENTOS:oficina-os-saga-eventos}
spring.cloud.aws.sqs.enabled=${APP_MENSAGERIA_HABILITADA:true}
spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
